<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" href="shared/images/icons/favicon.png" type="image/png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="shared/images/icons/favicon-white.png" type="image/png" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="shared/images/icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" href="shared/images/icons/apple-touch-icon-dark.png" media="(prefers-color-scheme: dark)">
  <title>Brian Crink</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px 40px;
    }

    .header {
      padding: 48px 20px 28px;
      text-align: center;
    }

    h1 {
      font-size: 2.4rem;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .deck {
      width: 100%;
      max-width: 1100px;
      transition: max-width 0.55s cubic-bezier(0.22, 1.4, 0.36, 1);
    }

    .track {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      align-items: stretch;
      transition:
        transform 0.55s cubic-bezier(0.22, 1.4, 0.36, 1),
        gap 0.55s cubic-bezier(0.22, 1.4, 0.36, 1);
    }

    .card {
      min-width: 0;
      display: flex;
      transition:
        transform 0.45s cubic-bezier(0.22, 1.2, 0.36, 1),
        opacity 0.45s ease,
        filter 0.35s ease;
    }

    @media (min-width: 769px) {
      .card.is-focused {
        transform: translateY(-10px);
      }
    }

    .card-inner {
      width: 100%;
      border-radius: 20px;
      padding: 24px 18px 20px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.10);
      color: #fff;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      transition:
        border-radius 0.55s cubic-bezier(0.22, 1.4, 0.36, 1),
        padding 0.55s cubic-bezier(0.22, 1.4, 0.36, 1),
        transform 0.35s ease,
        box-shadow 0.35s ease,
        border-color 0.35s ease,
        background 0.35s ease;
    }

    /* LIFE focus: mostly blue border, tiny yellow/green ends, subtle rounded glow */
    .card.life.is-focused {
      filter:
        drop-shadow(0 0 4px rgba(14, 165, 233, 0.35))
        drop-shadow(0 0 8px rgba(14, 165, 233, 0.18));
    }

    .card.life.is-focused .card-inner {
      border: 2px solid transparent;
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
      background:
        radial-gradient(ellipse 130% 90% at 55% -15%, rgba(250, 204, 21, 0.28), transparent 58%) padding-box,
        linear-gradient(180deg, #38bdf8 0%, #0ea5e9 45%, #0284c7 100%) padding-box,
        linear-gradient(
          to bottom,
          #fde047 0%,
          #facc15 3%,
          #38bdf8 7%,
          #0ea5e9 18%,
          #0284c7 40%,
          #0369a1 60%,
          #075985 82%,
          #4ade80 94%,
          #22c55e 97%,
          #16a34a 100%
        ) border-box;
      background-clip: padding-box, padding-box, border-box;
      background-origin: border-box;
    }

    .card.build.is-focused .card-inner {
      border-color: rgba(134, 239, 172, 0.95);
      box-shadow:
        0 0 0 1px rgba(134, 239, 172, 0.55),
        0 0 24px rgba(34, 197, 94, 0.55),
        0 12px 40px rgba(0,0,0,0.45);
    }

    .card.work.is-focused .card-inner {
      border-color: rgba(255, 255, 255, 0.55);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.25),
        0 0 24px rgba(255, 255, 255, 0.18),
        0 12px 40px rgba(0,0,0,0.45);
    }

    .card.commerce.is-focused .card-inner {
      border-color: rgba(253, 186, 116, 0.95);
      box-shadow:
        0 0 0 1px rgba(253, 186, 116, 0.55),
        0 0 24px rgba(249, 115, 22, 0.55),
        0 12px 40px rgba(0,0,0,0.45);
    }

    .deck.jelly .card-inner {
      animation: jellyPulse 0.7s cubic-bezier(0.22, 1.4, 0.36, 1);
    }

    @keyframes jellyPulse {
      0%   { transform: scale(0.96); }
      40%  { transform: scale(1.03); }
      70%  { transform: scale(0.99); }
      100% { transform: scale(1); }
    }

    .card.life .card-inner {
      background:
        radial-gradient(ellipse 120% 80% at 50% -10%, rgba(250, 204, 21, 0.2), transparent 55%),
        linear-gradient(180deg, #0ea5e9 0%, #0284c7 48%, #0369a1 100%);
      border-color: rgba(255,255,255,0.18);
    }

    .life-sun {
      position: absolute;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      left: 0;
      top: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0;
      background:
        radial-gradient(circle at 35% 35%, #fff7ae 0%, #fde047 35%, #f59e0b 72%, #d97706 100%);
      box-shadow:
        0 0 18px rgba(250, 204, 21, 0.75),
        0 0 36px rgba(245, 158, 11, 0.45),
        0 0 60px rgba(234, 179, 8, 0.25);
      will-change: transform, opacity;
      transform: translate(-30px, 78%) scale(0.7);
    }

    .life-sun::after {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(253, 224, 71, 0.35), transparent 70%);
    }

    .life-grass {
      position: absolute;
      left: -2%;
      right: -2%;
      bottom: -2px;
      height: 64px;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .blade {
      position: absolute;
      bottom: 0;
      width: var(--w, 6px);
      height: var(--h, 40px);
      border-radius: 80% 80% 20% 20% / 100% 100% 10% 10%;
      transform-origin: bottom center;
      transform: scaleY(0) rotate(var(--tilt, 0deg)) skewX(var(--skew, 0deg));
      opacity: 0;
      will-change: transform, opacity;
      background: linear-gradient(
        to top,
        var(--c1) 0%,
        var(--c2) 42%,
        var(--c3) 78%,
        var(--c4, var(--c3)) 100%
      );
      filter: saturate(1.08) contrast(1.05);
      box-shadow: 1px 0 0 rgba(0,0,0,0.08);
    }

    .blade.b1  { left: 1%;  --h:28px; --w:5px; --tilt:-10deg; --skew:4deg;  --c1:#14532d; --c2:#166534; --c3:#15803d; --c4:#4ade80; }

    .life-ground {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 18px;
      z-index: 0;
      pointer-events: none;
      background:
        linear-gradient(to top, rgba(20, 83, 45, 0.55), rgba(22, 101, 52, 0.2) 55%, transparent);
      opacity: 0;
      transition: opacity 0.45s ease;
    }

    .card.life.is-focused .life-ground { opacity: 1; }

    .card.life.is-focused .blade {
      animation: bladeSway 3.6s ease-in-out infinite;
    }

    .card.life.is-focused .blade.b1, .card.life.is-focused .blade.f1 { animation-delay: 0.0s; }
    .card.life.is-focused .blade.b2, .card.life.is-focused .blade.f2 { animation-delay: 0.12s; }
    .card.life.is-focused .blade.b3, .card.life.is-focused .blade.f3 { animation-delay: 0.24s; }
    .card.life.is-focused .blade.b4, .card.life.is-focused .blade.f4 { animation-delay: 0.08s; }
    .card.life.is-focused .blade.b5, .card.life.is-focused .blade.f5 { animation-delay: 0.3s; }
    .card.life.is-focused .blade.b6, .card.life.is-focused .blade.f6 { animation-delay: 0.16s; }

    @keyframes bladeSway {
      0%, 100% { translate: 0 0; }
      50% { translate: 1.5px 0; }
    }

    .card.build .card-inner {
      background-color: #15803d;
      background-image:
        linear-gradient(to right, rgba(187, 247, 208, 0.28) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(187, 247, 208, 0.28) 1px, transparent 1px);
      background-size: 24px 24px;
      border-color: rgba(255,255,255,0.18);
    }

    .build-icons {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .build-icon {
      position: absolute;
      font-size: 1.35rem;
      line-height: 1;
      opacity: 0;
      transform: translate(0, 0) scale(0.85);
      will-change: transform, opacity;
    }

    .build-icon.i1 { top: 12%; left: 10%; }
    .build-icon.i2 { top: 10%; right: 12%; }
    .build-icon.i3 { top: 38%; left: 8%; }
    .build-icon.i4 { top: 42%; right: 10%; }
    .build-icon.i5 { bottom: 18%; left: 12%; }
    .build-icon.i6 { bottom: 14%; right: 14%; }
    .build-icon.i7 { top: 22%; left: 42%; }
    .build-icon.i8 { bottom: 28%; left: 44%; }

    .card.work .card-inner {
      background-color: #000000;
      background-image:
        linear-gradient(to right,  rgba(16, 16, 16, 0.6) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(16, 16, 16, 0.6) 1px, transparent 1px);
      background-size: 24px 24px, 24px 24px;
      background-position: 0 0, 0 0;
      border-color: rgba(255,255,255,0.10);
    }

    .card.work .card-inner::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, #161616 2px, transparent 1px);
      background-size: 24px 24px;
      background-position: 12px 12px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.45;
      will-change: opacity;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
      animation: none;
    }

    .card.work.is-focused .card-inner::before {
      animation: dotPulse 6s ease-in-out infinite;
      opacity: 0.75;
    }

    @keyframes dotPulse {
      0%, 100% { opacity: 0; }
      50%      { opacity: 0.95; }
    }

    .card.commerce .card-inner {
      background: #ea580c;
      border-color: rgba(255,255,255,0.18);
    }

    .card.life .category,
    .card.life .subtitle,
    .card.build .category,
    .card.build .subtitle,
    .card.commerce .category,
    .card.commerce .subtitle {
      color: rgba(255,255,255,0.85);
    }

    .category {
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #8b949e;
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
    }

    .card h2 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 6px;
      transition: font-size 0.45s ease;
      position: relative;
      z-index: 1;
    }

    .subtitle {
      font-size: 0.88rem;
      color: #8b949e;
      margin-bottom: 18px;
      position: relative;
      z-index: 1;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      z-index: 1;
    }

    .links a {
      display: block;
      text-decoration: none;
      color: #fff;
      font-size: 0.98rem;
      font-weight: 500;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.14);
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .card.work .links a {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .links a:hover {
      background: rgba(255,255,255,0.18);
      border-color: rgba(255,255,255,0.28);
    }

    .nav-dots, .hint {
      display: none;
      transition: opacity 0.35s ease;
    }

    @media (max-width: 768px) {
      body {
        overflow: hidden;
        padding-bottom: 0;
      }

      .deck {
        flex: 1;
        max-width: 440px;
        position: relative;
        overflow: hidden;
        touch-action: pan-y;

        min-width: 100%;

        padding: 28px 22px 24px;

      .card h2 { font-size: 1.8rem; }
      .subtitle { font-size: 0.95rem; margin-bottom: 22px; }

      .nav-dots {
        display: flex;
        gap: 8px;
        justify-content: center;
        padding: 18px 0 36px;
      }

      .nav-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: rgba(255,255,255,0.2);
        transition: background 0.2s ease, transform 0.2s ease;
      }

      .nav-dot.active {
        background: #00ff9d;
        transform: scale(1.15);
      }

      .hint {
        display: block;
        position: absolute;
        bottom: 78px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 0.75rem;
        color: rgba(255,255,255,0.28);
        pointer-events: none;
      }
    }
  </style>
</head>
<body>

  <script>
    const track = document.getElementById('track');
    const deck = document.getElementById('deck');
    const cards = [...document.querySelectorAll('.card')];
    const dots = [...document.querySelectorAll('.nav-dot')];
    const buildCard = document.querySelector('.card.build');
    const lifeCard = document.querySelector('.card.life');
    const buildInner = document.getElementById('buildInner');
    const lifeInner = document.getElementById('lifeInner');
    const lifeSun = document.getElementById('lifeSun');
    const blades = [...document.querySelectorAll('.blade')];
    const buildIcons = [...document.querySelectorAll('.build-icon')];
    const total = cards.length;

    let index = 0;
    let startX = 0;
    let deltaX = 0;
    let dragging = false;
    let wasMobile = window.matchMedia('(max-width: 768px)').matches;
    let sunAnim = null;

    const LIFE_MOVE_MS = 1100;
    const GRASS_MS = 900;
    const SUN_REST_T = 0.62;

    function sunPoint(t, w, h) {
      const x = -30 + t * (w + 60);
      const y = h * 0.48 - Math.sin(Math.PI * t) * (h * 0.42);
      const scale = 0.72 + Math.sin(Math.PI * t) * 0.38;
      return { x, y, scale };
    }

    function setSun(t, opacity) {
      const w = lifeInner.clientWidth;
      const h = lifeInner.clientHeight;
      const p = sunPoint(t, w, h);
      lifeSun.style.opacity = String(opacity);
      lifeSun.style.transform = `translate(${p.x}px, ${p.y}px) scale(${p.scale})`;
    }

    function animateSun(fromT, toT, fromOp, toOp, duration) {
      if (sunAnim) cancelAnimationFrame(sunAnim);
      const start = performance.now();
      return new Promise((resolve) => {
        function frame(now) {
          const u = Math.min(1, (now - start) / duration);
          const e = 1 - Math.pow(1 - u, 3);
          setSun(fromT + (toT - fromT) * e, fromOp + (toOp - fromOp) * e);
          if (u < 1) sunAnim = requestAnimationFrame(frame);
          else { sunAnim = null; resolve(); }
        }
        sunAnim = requestAnimationFrame(frame);
      });
    }

    function growGrass() {
      blades.forEach((blade, i) => {
        const delay = 20 + i * 16;
        const tilt = getComputedStyle(blade).getPropertyValue('--tilt') || '0deg';
        const skew = getComputedStyle(blade).getPropertyValue('--skew') || '0deg';
        blade.style.transition = 'none';
        blade.style.opacity = '0';
        blade.style.transform = `scaleY(0) rotate(${tilt}) skewX(${skew})`;
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            blade.style.transition =
              `transform ${GRASS_MS}ms cubic-bezier(0.22, 1.25, 0.36, 1) ${delay}ms,` +
              `opacity 260ms ease ${delay}ms`;
            blade.style.opacity = '1';
            blade.style.transform = `scaleY(1) rotate(${tilt}) skewX(${skew})`;
          });
        });
      });
    }

    function retractGrass() {
      blades.forEach((blade, i) => {
        const delay = i * 10;
        const tilt = getComputedStyle(blade).getPropertyValue('--tilt') || '0deg';
        const skew = getComputedStyle(blade).getPropertyValue('--skew') || '0deg';
        blade.style.transition =
          `transform 500ms cubic-bezier(0.4, 0, 0.2, 1) ${delay}ms,` +
          `opacity 200ms ease ${delay + 160}ms`;
        blade.style.opacity = '0';
        blade.style.transform = `scaleY(0) rotate(${tilt}) skewX(${skew})`;
      });
    }

    async function lifeEnter() {
      setSun(0, 0);
      growGrass();
      await animateSun(0, SUN_REST_T, 0, 1, LIFE_MOVE_MS);
    }

    async function lifeExit() {
      retractGrass();
      await animateSun(SUN_REST_T, 1.05, 1, 0, LIFE_MOVE_MS * 0.9);
    }

    function syncLife(focusedIndex) {
      const lifeIndex = Number(lifeCard.dataset.index);
      if (focusedIndex === lifeIndex) lifeEnter();
      else if (lifeCard.classList.contains('was-focused') || Number(lifeSun.style.opacity || 0) > 0.05) lifeExit();
      else { setSun(0, 0); retractGrass(); }
    }

    const EDGE_MARGIN = 36;
    const MOVE_MS = 640;
    const FADE_MS = 200;

    function getExitOffset(icon, container) {
      const c = container.getBoundingClientRect();
      const r = icon.getBoundingClientRect();
      const iconCx = r.left + r.width / 2;
      const iconCy = r.top + r.height / 2;
      const cardCx = c.left + c.width / 2;
      const distLeft = iconCx - c.left;
      const distRight = c.right - iconCx;
      const distTop = iconCy - c.top;
      const distBottom = c.bottom - iconCy;
      const nearest = Math.min(distLeft, distRight, distTop, distBottom);
      let dx = 0, dy = 0;
      if (nearest === distLeft) dx = -(distLeft + r.width / 2 + EDGE_MARGIN);
      else if (nearest === distRight) dx = distRight + r.width / 2 + EDGE_MARGIN;
      else if (nearest === distTop) dy = -(distTop + r.height / 2 + EDGE_MARGIN);
      else dy = distBottom + r.height / 2 + EDGE_MARGIN;
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1) {
        dx = iconCx < cardCx ? -(distLeft + EDGE_MARGIN) : (distRight + EDGE_MARGIN);
      }
      return { dx, dy };
    }

    function setIconTransform(icon, dx, dy, scale, opacity) {
      icon.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
      icon.style.opacity = String(opacity);
    }

    function prepareIconsOffCard() {
      buildIcons.forEach((icon) => {
        icon.style.transition = 'none';
        setIconTransform(icon, 0, 0, 1, 0);
      });
      void buildInner.offsetWidth;
      buildIcons.forEach((icon) => setIconTransform(icon, 0, 0, 1, 0));
      void buildInner.offsetWidth;
      buildIcons.forEach((icon) => {
        const { dx, dy } = getExitOffset(icon, buildInner);
        icon.dataset.exitX = dx;
        icon.dataset.exitY = dy;
        setIconTransform(icon, dx, dy, 0.85, 0);
      });
    }

    function animateIconsIn() {
      buildIcons.forEach((icon, i) => {
        const delay = i * 55;
        icon.style.transition = 'none';
        const x = Number(icon.dataset.exitX || 0);
        const y = Number(icon.dataset.exitY || 0);
        setIconTransform(icon, x, y, 0.85, 0);
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            icon.style.transition =
              `transform ${MOVE_MS}ms cubic-bezier(0.22, 1.2, 0.36, 1) ${delay}ms,` +
              `opacity ${FADE_MS}ms ease ${delay}ms`;
            setIconTransform(icon, 0, 0, 1, 0.9);
          });
        });
      });
    }

    function animateIconsOut() {
      buildIcons.forEach((icon) => {
        icon.style.transition = 'none';
        setIconTransform(icon, 0, 0, 1, 0.9);
      });
      void buildInner.offsetWidth;
      buildIcons.forEach((icon) => {
        const { dx, dy } = getExitOffset(icon, buildInner);
        icon.dataset.exitX = dx;
        icon.dataset.exitY = dy;
      });
      buildIcons.forEach((icon, i) => {
        const delay = i * 30;
        const x = Number(icon.dataset.exitX || 0);
        const y = Number(icon.dataset.exitY || 0);
        const fadeDelay = delay + Math.max(0, MOVE_MS - FADE_MS - 40);
        icon.style.transition =
          `transform ${MOVE_MS}ms cubic-bezier(0.22, 1.15, 0.36, 1) ${delay}ms,` +
          `opacity ${FADE_MS}ms ease ${fadeDelay}ms`;
        requestAnimationFrame(() => setIconTransform(icon, x, y, 0.85, 0));
      });
    }

    function syncBuildIcons(focusedIndex) {
      const buildIndex = Number(buildCard.dataset.index);
      if (focusedIndex === buildIndex) {
        if (!buildIcons[0].dataset.exitX) prepareIconsOffCard();
        animateIconsIn();
      } else {
        const anyVisible = buildIcons.some((icon) => Number(icon.style.opacity || 0) > 0.05);
        if (anyVisible || buildCard.classList.contains('was-focused')) animateIconsOut();
        else prepareIconsOffCard();
      }
    }

    function isMobile() {
      return window.matchMedia('(max-width: 768px)').matches;
    }

    function setFocus(i) {
      const prev = index;
      index = Math.max(0, Math.min(total - 1, i));
      cards.forEach((card, n) => {
        if (n === prev) card.classList.add('was-focused');
        card.classList.toggle('is-focused', n === index);
      });
      dots.forEach((d, n) => d.classList.toggle('active', n === index));
      if (isMobile()) track.style.transform = `translateX(-${index * 100}%)`;
      else track.style.transform = 'none';
      syncLife(index);
      syncBuildIcons(index);
      setTimeout(() => {
        cards.forEach((card) => card.classList.remove('was-focused'));
      }, Math.max(MOVE_MS, LIFE_MOVE_MS) + 200);
    }

    function triggerJelly() {
      deck.classList.remove('jelly');
      void deck.offsetWidth;
      deck.classList.add('jelly');
      setTimeout(() => deck.classList.remove('jelly'), 700);
    }

    function onBreakpointChange() {
      const mobile = isMobile();
      if (mobile !== wasMobile) {
        triggerJelly();
        wasMobile = mobile;
      }
      prepareIconsOffCard();
      setFocus(index);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') { e.preventDefault(); setFocus(index + 1); }
      if (e.key === 'ArrowLeft')  { e.preventDefault(); setFocus(index - 1); }
    });

    cards.forEach((card, n) => {
      card.addEventListener('click', (e) => {
        if (e.target.closest('a')) return;
        setFocus(n);
      });
    });

    deck.addEventListener('touchstart', (e) => {
      if (!isMobile()) return;
      dragging = true;
      startX = e.touches[0].clientX;
      deltaX = 0;
      track.style.transition = 'none';
    }, { passive: true });

    deck.addEventListener('touchmove', (e) => {
      if (!dragging || !isMobile()) return;
      deltaX = e.touches[0].clientX - startX;
      const percent = (deltaX / deck.offsetWidth) * 100;
      track.style.transform = `translateX(calc(-${index * 100}% + ${percent}%))`;
    }, { passive: true });

    deck.addEventListener('touchend', () => {
      if (!isMobile()) return;
      dragging = false;
      track.style.transition = 'transform 0.55s cubic-bezier(0.22, 1.4, 0.36, 1)';
      if (Math.abs(deltaX) > 50) setFocus(index + (deltaX < 0 ? 1 : -1));
      else setFocus(index);
    });

    window.addEventListener('resize', onBreakpointChange);

    prepareIconsOffCard();
    setSun(0, 0);
    setFocus(0);
  </script>
