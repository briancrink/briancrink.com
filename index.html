<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" href="shared/images/icons/favicon.png" type="image/png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="shared/images/icons/favicon-white.png" type="image/png" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="shared/images/icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" href="shared/images/icons/apple-touch-icon-dark.png" media="(prefers-color-scheme: dark)">
  <title>Brian Crink</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      height: 100%;
      background: #020617; /* fallback if anything shows through */
    }

    html, body {
      min-height: 100%;
      min-height: 100dvh;
      min-height: -webkit-fill-available; /* iOS Safari */
    }

    body {
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 0 16px 28px;
      overflow: hidden;
      background: transparent; /* ambient layer paints the page */
      /* background: #020617; */
      /* background: #000000; */
      transition: background 0.55s ease;
    }

    .ambient {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      transition: background 0.55s ease;
    }

    /* Ambient “bias lighting” per portal (darker / quieter than the card) */
    /* body.portal-life {
      background:
        radial-gradient(ellipse 90% 70% at 50% 40%, rgba(14, 165, 233, 0.16), transparent 60%),
        #020617;
    } */
    body.portal-life .ambient {
      background:
        radial-gradient(ellipse 90% 120% at 50% 50%, rgba(14, 164, 233, 0.811), transparent 70%),
        #020617;
    }
    /* body.portal-build {
      background:
        radial-gradient(ellipse 90% 70% at 50% 50%, rgba(22, 163, 74, 0.14), transparent 60%),
        #03140a;
    } */
    body.portal-build .ambient {
      background:
        radial-gradient(ellipse 90% 120% at 50% 50%, rgba(22, 163, 74, 0.811), transparent 70%),
        #03140a;
    }
    /* body.portal-work {
      background:
        radial-gradient(ellipse 90% 70% at 50% 50%, rgba(148, 163, 184, 0.08), transparent 60%),
        #000000;
    } */
    body.portal-work .ambient{
      background:
        radial-gradient(ellipse 90% 120% at 50% 50%, rgba(17, 17, 17, 0.811), transparent 70%),
        #000000;
    }
    /* body.portal-commerce {
      background:
        radial-gradient(circle 1300px at 50% 50%,rgba(255, 89, 0, 0.928), transparent 70%),
      #1b0a00;
    } */
    body.portal-commerce .ambient{
      background:
        radial-gradient(ellipse 90% 120% at 50% 50%, rgba(255, 89, 0, 0.811), transparent 70%),
        #321200;
    }

  /* Phone: cover tall viewport, softer top/bottom bands */
@media (max-width: 768px) {
  body.portal-life .ambient {
    background:
      radial-gradient(
        ellipse 120% 140% at 50% 40%,
        rgba(14, 164, 233, 0.85) 0%,
        rgba(14, 164, 233, 0.35) 45%,
        transparent 75%
      ),
      #020617;
  }

  body.portal-build .ambient {
    background:
      radial-gradient(
        ellipse 120% 140% at 50% 40%,
        rgba(22, 163, 74, 0.85) 0%,
        rgba(22, 163, 74, 0.35) 45%,
        transparent 75%
      ),
      #03140a;
  }

  body.portal-work .ambient {
    background:
      radial-gradient(
        ellipse 120% 140% at 50% 40%,
        rgba(60, 60, 60, 0.9) 0%,

        transparent 75%
      ),

  body.portal-commerce .ambient {

      radial-gradient(
        ellipse 120% 140% at 50% 40%,

    .header,
    .portal-stage,
    .nav-dots {
      position: relative;
      z-index: 1;
    }

    .header {
      padding: 80px 20px 18px;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: 0px;
    }

    .portal-stage {
      width: 100%;
      max-width: 420px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
      touch-action: pan-y;
    }

    .portal {
      width: 100%;
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      min-height: 520px;
      border: 2px solid rgba(255, 255, 255, 0.14);
      box-shadow: none;
      transition: border-color 0.45s ease, filter 0.45s ease;
    }

    .portal.life-active {
      border-color: transparent;
      filter: drop-shadow(0 0 4px rgba(14, 165, 233, 0.3))
              drop-shadow(0 0 8px rgba(14, 165, 233, 0.14));
      background:
        linear-gradient(transparent, transparent) padding-box,
        linear-gradient(
          to bottom,
          #fde047 0%,
          #facc15 3%,
          #68d2ff 7%,
          #38bdf8 18%,
          #38bdf8 40%,
          #38bdf8 60%,
          #38bdf8 82%,
          #4ade80 94%,
          #22c55e 97%,
          #16a34a 100%
        ) border-box;
      background-clip: padding-box, border-box;
      background-origin: border-box;
    }

    .portal.build-active {
      border-color: rgba(134, 239, 172, 0.45);
      filter: drop-shadow(0 0 4px rgba(34, 197, 94, 0.28))
              drop-shadow(0 0 8px rgba(34, 197, 94, 0.12));
    }

    .portal.work-active {
      border-color: rgba(255, 255, 255, 0.12);
      filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.12))
              drop-shadow(0 0 8px rgba(255, 255, 255, 0.06));
    }

    .portal.commerce-active {
      border-color: rgba(253, 186, 116, 0.5);
      filter: drop-shadow(0 0 4px rgba(249, 115, 22, 0.28))
              drop-shadow(0 0 8px rgba(249, 115, 22, 0.12));
    }

    .world {
      position: absolute;
      inset: 0;
      padding: 28px 22px 24px;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transform: translateX(18px);
      transition:
        opacity 0.45s ease,
        transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      overflow: hidden;
      border-radius: 0px;
    }

    .world.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0);
      z-index: 2;
    }

    .world.exit-left {
      opacity: 0;
      transform: translateX(-18px);
    }

    .world.exit-right {
      opacity: 0;
      transform: translateX(18px);
    }

    /* LIFE */
    .world.life {
      background:
        radial-gradient(ellipse 130% 90% at 55% -15%, rgba(250, 204, 21, 0.28), transparent 58%),
        linear-gradient(180deg, #38bdf8 0%, #0ea5e9 45%, #0284c7 100%);
    }

    .world.life.active {
      border: none;
      background:
        radial-gradient(ellipse 130% 90% at 55% -15%, rgba(250, 204, 21, 0.28), transparent 58%),
        linear-gradient(180deg, #38bdf8 0%, #0ea5e9 45%, #0284c7 100%);
    }

    .life-sun {
      position: absolute;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      left: 0;
      top: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0;
      background:
        radial-gradient(circle at 35% 35%, #fff7ae 0%, #fde047 35%, #f59e0b 72%, #d97706 100%);
      box-shadow:
        0 0 18px rgba(250, 204, 21, 0.75),
        0 0 36px rgba(245, 158, 11, 0.45);
      will-change: transform, opacity;
      transform: translate(-30px, 78%) scale(0.7);
    }

    .life-sun::after {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(253, 224, 71, 0.35), transparent 70%);
    }

    .life-grass {
      position: absolute;
      left: -2%;
      right: -2%;
      bottom: -2px;
      height: 64px;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .blade {
      position: absolute;
      bottom: 0;
      width: var(--w, 6px);
      height: var(--h, 40px);
      border-radius: 80% 80% 20% 20% / 100% 100% 10% 10%;
      transform-origin: bottom center;
      transform: scaleY(0) rotate(var(--tilt, 0deg)) skewX(var(--skew, 0deg));
      opacity: 0;
      will-change: transform, opacity;
      background: linear-gradient(to top, var(--c1) 0%, var(--c2) 42%, var(--c3) 78%, var(--c4, var(--c3)) 100%);
      filter: saturate(1.08) contrast(1.05);
    }

    .life-ground {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 18px;
      z-index: 0;
      pointer-events: none;
      background: linear-gradient(to top, rgba(20, 83, 45, 0.55), rgba(22, 101, 52, 0.2) 55%, transparent);
      opacity: 0;
      transition: opacity 0.45s ease;
    }

    .world.life.active .life-ground { opacity: 1; }
    .world.life.active .blade { animation: bladeSway 3.6s ease-in-out infinite; }

    @keyframes bladeSway {
      0%, 100% { translate: 0 0; }
      50% { translate: 1.5px 0; }
    }

    /* BUILD */
    .world.build {
      background-color: #15803d;
      background-image:
        linear-gradient(to right, rgba(187, 247, 208, 0.28) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(187, 247, 208, 0.28) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    .build-icons {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .build-icon {
      position: absolute;
      font-size: 1.35rem;
      line-height: 1;
      opacity: 0;
      transform: translate(0, 0) scale(0.85);
      will-change: transform, opacity;
    }

    .build-icon.i1 { top: 12%; left: 10%; }
    .build-icon.i2 { top: 10%; right: 12%; }
    .build-icon.i3 { top: 38%; left: 8%; }
    .build-icon.i4 { top: 42%; right: 10%; }
    .build-icon.i5 { bottom: 18%; left: 12%; }
    .build-icon.i6 { bottom: 14%; right: 14%; }
    .build-icon.i7 { top: 22%; left: 42%; }
    .build-icon.i8 { bottom: 28%; left: 44%; }

    /* WORK */
    .world.work {
      background-color: #000;
      background-image:
        linear-gradient(to right,  rgba(16, 16, 16, 0.6) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(16, 16, 16, 0.6) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    .world.work::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, #161616 2px, transparent 1px);
      background-size: 24px 24px;
      background-position: 12px 12px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.45;
      animation: none;
    }

    .world.work.active::before {
      animation: dotPulse 6s ease-in-out infinite;
      opacity: 0.75;
    }

    @keyframes dotPulse {
      0%, 100% { opacity: 0; }
      50%      { opacity: 0.95; }
    }

    /* COMMERCE */
    .world.commerce {
      background: #ea580c;
    }

    .category {
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.8);
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
    }

    .world h2 {
      font-size: 1.8rem;
      font-weight: 600;

  <!-- <div class="hint">swipe left / right</div> -->

  <script>
    const body = document.body;
    const portal = document.getElementById('portal');
    const stage = document.getElementById('stage');
    const worlds = [...document.querySelectorAll('.world')];
    const dots = [...document.querySelectorAll('.nav-dot')];
    const lifeSun = document.getElementById('lifeSun');
    const lifeWorld = document.querySelector('.world.life');
    const buildWorld = document.getElementById('buildWorld');
    const blades = [...document.querySelectorAll('.blade')];
    const buildIcons = [...document.querySelectorAll('.build-icon')];

    const PORTALS = ['life', 'build', 'work', 'commerce'];
    const LIFE_MOVE_MS = 1100;
    const GRASS_MS = 900;
    const SUN_REST_T = 0.62;
    const EDGE_MARGIN = 36;
    const MOVE_MS = 640;
    const FADE_MS = 200;

    let index = 0;
    let startX = 0;
    let deltaX = 0;
    let dragging = false;
    let sunAnim = null;
    let transitioning = false;

    function sunPoint(t, w, h) {
      const x = -30 + t * (w + 60);
      const y = h * 0.48 - Math.sin(Math.PI * t) * (h * 0.42);
      const scale = 0.72 + Math.sin(Math.PI * t) * 0.38;
      return { x, y, scale };
    }

    function setSun(t, opacity) {
      const w = lifeWorld.clientWidth;
      const h = lifeWorld.clientHeight;
      const p = sunPoint(t, w, h);
      lifeSun.style.opacity = String(opacity);
      lifeSun.style.transform = `translate(${p.x}px, ${p.y}px) scale(${p.scale})`;
    }

    function animateSun(fromT, toT, fromOp, toOp, duration) {
      if (sunAnim) cancelAnimationFrame(sunAnim);
      const start = performance.now();
      return new Promise((resolve) => {
        function frame(now) {
          const u = Math.min(1, (now - start) / duration);
          const e = 1 - Math.pow(1 - u, 3);
          setSun(fromT + (toT - fromT) * e, fromOp + (toOp - fromOp) * e);
          if (u < 1) sunAnim = requestAnimationFrame(frame);
          else { sunAnim = null; resolve(); }
        }
        sunAnim = requestAnimationFrame(frame);
      });
    }

    function growGrass() {
      blades.forEach((blade, i) => {
        const delay = 20 + i * 16;
        const tilt = getComputedStyle(blade).getPropertyValue('--tilt') || '0deg';
        const skew = getComputedStyle(blade).getPropertyValue('--skew') || '0deg';
        blade.style.transition = 'none';
        blade.style.opacity = '0';
        blade.style.transform = `scaleY(0) rotate(${tilt}) skewX(${skew})`;
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            blade.style.transition =
              `transform ${GRASS_MS}ms cubic-bezier(0.22, 1.25, 0.36, 1) ${delay}ms,` +
              `opacity 260ms ease ${delay}ms`;
            blade.style.opacity = '1';
            blade.style.transform = `scaleY(1) rotate(${tilt}) skewX(${skew})`;
          });
        });
      });
    }

    function retractGrass() {
      blades.forEach((blade, i) => {
        const delay = i * 10;
        const tilt = getComputedStyle(blade).getPropertyValue('--tilt') || '0deg';
        const skew = getComputedStyle(blade).getPropertyValue('--skew') || '0deg';
        blade.style.transition =
          `transform 500ms cubic-bezier(0.4, 0, 0.2, 1) ${delay}ms,` +
          `opacity 200ms ease ${delay + 160}ms`;
        blade.style.opacity = '0';
        blade.style.transform = `scaleY(0) rotate(${tilt}) skewX(${skew})`;
      });
    }

    async function lifeEnter() {
      setSun(0, 0);
      growGrass();
      await animateSun(0, SUN_REST_T, 0, 1, LIFE_MOVE_MS);
    }

    async function lifeExit() {
      retractGrass();
      await animateSun(SUN_REST_T, 1.05, 1, 0, LIFE_MOVE_MS * 0.9);
    }

    function getExitOffset(icon, container) {
      const c = container.getBoundingClientRect();
      const r = icon.getBoundingClientRect();
      const iconCx = r.left + r.width / 2;
      const iconCy = r.top + r.height / 2;
      const cardCx = c.left + c.width / 2;
      const distLeft = iconCx - c.left;
      const distRight = c.right - iconCx;
      const distTop = iconCy - c.top;
      const distBottom = c.bottom - iconCy;
      const nearest = Math.min(distLeft, distRight, distTop, distBottom);
      let dx = 0, dy = 0;
      if (nearest === distLeft) dx = -(distLeft + r.width / 2 + EDGE_MARGIN);
      else if (nearest === distRight) dx = distRight + r.width / 2 + EDGE_MARGIN;
      else if (nearest === distTop) dy = -(distTop + r.height / 2 + EDGE_MARGIN);
      else dy = distBottom + r.height / 2 + EDGE_MARGIN;
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1) {
        dx = iconCx < cardCx ? -(distLeft + EDGE_MARGIN) : (distRight + EDGE_MARGIN);
      }
      return { dx, dy };
    }

    function setIconTransform(icon, dx, dy, scale, opacity) {
      icon.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
      icon.style.opacity = String(opacity);
    }

    function prepareIconsOffCard() {
      buildIcons.forEach((icon) => {
        icon.style.transition = 'none';
        setIconTransform(icon, 0, 0, 1, 0);
      });
      void buildWorld.offsetWidth;
      buildIcons.forEach((icon) => {
        const { dx, dy } = getExitOffset(icon, buildWorld);
        icon.dataset.exitX = dx;
        icon.dataset.exitY = dy;
        setIconTransform(icon, dx, dy, 0.85, 0);
      });
    }

    function animateIconsIn() {
      buildIcons.forEach((icon, i) => {
        const delay = i * 55;
        const x = Number(icon.dataset.exitX || 0);
        const y = Number(icon.dataset.exitY || 0);
        icon.style.transition = 'none';
        setIconTransform(icon, x, y, 0.85, 0);
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            icon.style.transition =
              `transform ${MOVE_MS}ms cubic-bezier(0.22, 1.2, 0.36, 1) ${delay}ms,` +
              `opacity ${FADE_MS}ms ease ${delay}ms`;
            setIconTransform(icon, 0, 0, 1, 0.9);
          });
        });
      });
    }

    function animateIconsOut() {
      buildIcons.forEach((icon) => {
        icon.style.transition = 'none';
        setIconTransform(icon, 0, 0, 1, 0.9);
      });
      void buildWorld.offsetWidth;
      buildIcons.forEach((icon) => {
        const { dx, dy } = getExitOffset(icon, buildWorld);
        icon.dataset.exitX = dx;
        icon.dataset.exitY = dy;
      });
      buildIcons.forEach((icon, i) => {
        const delay = i * 30;
        const x = Number(icon.dataset.exitX || 0);
        const y = Number(icon.dataset.exitY || 0);
        const fadeDelay = delay + Math.max(0, MOVE_MS - FADE_MS - 40);
        icon.style.transition =
          `transform ${MOVE_MS}ms cubic-bezier(0.22, 1.15, 0.36, 1) ${delay}ms,` +
          `opacity ${FADE_MS}ms ease ${fadeDelay}ms`;
        requestAnimationFrame(() => setIconTransform(icon, x, y, 0.85, 0));
      });
    }

    function setAmbient(name) {
      body.classList.remove('portal-life', 'portal-build', 'portal-work', 'portal-commerce');
      body.classList.add(`portal-${name}`);
      portal.classList.remove('life-active', 'build-active', 'work-active', 'commerce-active');
      portal.classList.add(`${name}-active`);
    }

    function activateWorldEffects(name) {
      if (name === 'life') lifeEnter();
      else {
        if (Number(lifeSun.style.opacity || 0) > 0.05) lifeExit();
        else { setSun(0, 0); retractGrass(); }
      }

      if (name === 'build') {
        if (!buildIcons[0].dataset.exitX) prepareIconsOffCard();
        animateIconsIn();
      } else {
        const anyVisible = buildIcons.some((icon) => Number(icon.style.opacity || 0) > 0.05);
        if (anyVisible) animateIconsOut();
        else prepareIconsOffCard();
      }
    }

    function setPortal(nextIndex, direction = 1) {
      if (transitioning) return;
      nextIndex = (nextIndex + PORTALS.length) % PORTALS.length;
      if (nextIndex === index) return;

      transitioning = true;
      const prev = worlds[index];
      const next = worlds[nextIndex];
      const name = PORTALS[nextIndex];

      prev.classList.remove('active');
      prev.classList.add(direction > 0 ? 'exit-left' : 'exit-right');

      next.classList.remove('exit-left', 'exit-right');
      next.style.transform = direction > 0 ? 'translateX(18px)' : 'translateX(-18px)';
      void next.offsetWidth;
      next.classList.add('active');
      next.style.transform = '';

      setAmbient(name);
      activateWorldEffects(name);

      dots.forEach((d, i) => d.classList.toggle('active', i === nextIndex));
      index = nextIndex;

      setTimeout(() => {
        prev.classList.remove('exit-left', 'exit-right');
        transitioning = false;
      }, 480);
    }

    /* Swipe */
    stage.addEventListener('touchstart', (e) => {
      dragging = true;
      startX = e.touches[0].clientX;
      deltaX = 0;
    }, { passive: true });

    stage.addEventListener('touchmove', (e) => {
      if (!dragging) return;
      deltaX = e.touches[0].clientX - startX;
    }, { passive: true });

    stage.addEventListener('touchend', () => {
      if (!dragging) return;
      dragging = false;
      if (Math.abs(deltaX) > 50) {
        setPortal(index + (deltaX < 0 ? 1 : -1), deltaX < 0 ? 1 : -1);
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') { e.preventDefault(); setPortal(index + 1, 1); }
      if (e.key === 'ArrowLeft')  { e.preventDefault(); setPortal(index - 1, -1); }
    });

    dots.forEach((dot) => {
      dot.addEventListener('click', () => {
        const i = Number(dot.dataset.index);
        setPortal(i, i > index ? 1 : -1);
      });
    });

    prepareIconsOffCard();
    setSun(0, 0);
    setAmbient('life');
    lifeEnter();
  </script>
