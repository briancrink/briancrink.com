<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" href="resources/images/icons/favicon.png" type="image/png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="resources/images/icons/favicon-white.png" type="image/png" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="resources/images/icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" href="resources/images/icons/apple-touch-icon-dark.png" media="(prefers-color-scheme: dark)">
  <title>Brian Crink</title>
  <style>
  :root { --gray: #6b6b6b; --white: #fff; --row: 48px; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden;
    overscroll-behavior: none; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center;
    font: 400 clamp(14px, 3.6vw, 40px)/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: var(--white); -webkit-user-select: none; user-select: none; }
  @media (max-width: 768px) { body { font-size: clamp(15px, 4vw, 40px); } }   /* phones: a touch larger */
  .line { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr);
    align-items: center; width: 100%; transition: transform .8s cubic-bezier(.2,.8,.2,1); }
  .reel { position: relative; height: calc(var(--row) * 9);
    -webkit-mask-image: linear-gradient(transparent, #000 18%, #000 82%, transparent);
            mask-image: linear-gradient(transparent, #000 18%, #000 82%, transparent); }
  .item { position: absolute; left: 0; right: 0; top: 50%; height: var(--row);
    margin-top: calc(var(--row) / -2); line-height: var(--row); white-space: nowrap;
    color: var(--gray); transition: color .35s; will-change: transform, opacity; }
  /* "portal" chroma gradient (same colours and timing as the 404 page) */
  @property --pc1 { syntax: '<color>'; inherits: false; initial-value: #ff006e; }
  @property --pc2 { syntax: '<color>'; inherits: false; initial-value: #8338ec; }
  @property --pc3 { syntax: '<color>'; inherits: false; initial-value: #3a86ff; }
  @property --pc4 { syntax: '<color>'; inherits: false; initial-value: #06d6a0; }
  @property --pc5 { syntax: '<color>'; inherits: false; initial-value: #ffbe0b; }
  @keyframes portalChromaFade {
    0%   { --pc1: #ff006e; --pc2: #8338ec; --pc3: #3a86ff; --pc4: #06d6a0; --pc5: #ffbe0b; }
    20%  { --pc1: #ffbe0b; --pc2: #ff006e; --pc3: #8338ec; --pc4: #3a86ff; --pc5: #06d6a0; }
    40%  { --pc1: #06d6a0; --pc2: #ffbe0b; --pc3: #ff006e; --pc4: #8338ec; --pc5: #3a86ff; }
    60%  { --pc1: #3a86ff; --pc2: #06d6a0; --pc3: #ffbe0b; --pc4: #ff006e; --pc5: #8338ec; }
    80%  { --pc1: #8338ec; --pc2: #3a86ff; --pc3: #06d6a0; --pc4: #ffbe0b; --pc5: #ff006e; }
    100% { --pc1: #ff006e; --pc2: #8338ec; --pc3: #3a86ff; --pc4: #06d6a0; --pc5: #ffbe0b; }
  }
  .item.chroma {
    left: auto; width: fit-content;   /* shrink to the text so the gradient spans just the word */
    background-image: linear-gradient(90deg, var(--pc1), var(--pc2), var(--pc3), var(--pc4), var(--pc5));
    -webkit-background-clip: text; background-clip: text;
    color: transparent; -webkit-text-fill-color: transparent;
    animation: portalChromaFade 8s linear infinite;
  }
  @media (prefers-reduced-motion: reduce) { .item.chroma { animation: none; } }
  .left .item { text-align: right; }
  .mid { color: var(--gray); white-space: pre; }
  .right { display: flex; align-items: center; opacity: 0; transition: opacity .6s; pointer-events: none; }
  .right.on { opacity: 1; }
  .slash { color: var(--gray); }
  .right .reel { flex: 1; min-width: 0; }
  .hint { position: fixed; bottom: max(24px, env(safe-area-inset-bottom)); left: 0; right: 0;
    text-align: center; font-size: 12px; color: #444; }
  </style>
  </head>
  <body>
    <div class="line" id="line">
      <div class="reel left" id="domReel"></div>
      <div class="mid">.briancrink.com</div>
      <div class="right" id="right"><span class="slash">/</span><div class="reel" id="pgReel"></div></div>
    </div>
    <div class="hint" id="hint">loading…</div>

  <script>
  // ── Configuration ──────────────────────────────────────────────────────────
  const SITEMAP_URL = "resources/site/map.json";      // served from the same site as this page
  const ROOT_HOST = "briancrink.com";       // the root entry in the sitemap is skipped (it isn't a subdomain)
  const HIDDEN_STATUSES = ["unlisted"];     // availability statuses left out of the reels
  const PAGE_LABEL = "path";                // "path" -> docs, adopt/cat   |   "title" -> API Docs, Adopt a Cat
  const START_SUBDOMAIN = "portal";         // the subdomain the opening spin lands on
  const INTRO_MS = 3200;                    // length of the opening subdomain spin (ease in, ease out)
  const PAGE_INTRO_MS = 2600;               // length of the subpage spin when the subpages appear
  const CHROMA_SUBDOMAIN = "portal";        // this subdomain gets the animated gradient when selected
  // Subpage text colours on settle, taken from the portal page's OS titles (.world h2):
  // life = blue, dev = green, career = purple, boss = orange. Keyed by subdomain, then subpage path.
  const PAGE_COLORS = {
    portal: { "#life": "#b5e8ffbc", "#dev": "#b0ffcdd0", "#career": "#ab7affda", "#boss": "#ffdbb5c2" },
  };
  const DELAY = 1000, DEFAULT_PAGE_WAIT = 7000;
  const FADE_OUT_MS = 2200, FADE_IN_MS = 600, REDIRECT_PAUSE = 2000;

  // ── State ──────────────────────────────────────────────────────────────────
  const $ = id => document.getElementById(id);
  const lineEl = $("line"), rightEl = $("right"), hintEl = $("hint");
  const mod = (a, n) => ((a % n) + n) % n;
  const ROWS = 9, MID = 4;
  let rowPx = 48;
  function measure() {
    rowPx = parseFloat(getComputedStyle(document.body).fontSize) * 1.5;
    document.documentElement.style.setProperty("--row", rowPx + "px");
  }
  measure(); addEventListener("resize", measure);

  const mk = n => ({ n, pos: 0, vel: 0, target: null, drag: false, dim: 0, dimTarget: 0 });
  let SITES = [], subLabels = [""], pageItems = [], pagesList = [""], pageColors = [];
  const dom = mk(1), pg = mk(1);
  const build = el => Array.from({ length: ROWS }, () => {
    const d = document.createElement("div"); d.className = "item"; el.appendChild(d); return d; });
  const domRows = build($("domReel")), pgRows = build($("pgReel"));

  let intro = null, ready = false, mode = "domain", holdIdx = null, pageTouched = false, isSettled = false;
  let lastInput = 0, settledAt = null, started = false, exiting = false, exitAt = 0;
  const active = () => (mode === "domain" ? dom : pg);
  // Any input counts as activity: it also cancels a fade-out that is already under way,
  // so the other subpages fade back in and the wait starts over.
  const touched = () => {
    started = true; intro = null;      // input also ends the opening spin where it is
    if (mode === "page") pageTouched = true;
    if (exiting) { exiting = false; settledAt = null; }
  };
  const curSite = () => SITES[mod(Math.round(dom.pos), dom.n)];
  const visible = o => !HIDDEN_STATUSES.includes(o?.availability?.status);

  // ── Load the sitemap ───────────────────────────────────────────────────────
  fetch(SITEMAP_URL, { cache: "no-cache" })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(map => {
      SITES = (map.domains || [])
        .filter(d => d.host !== ROOT_HOST && d.subdomain && visible(d))
        .map(d => {
          const pages = (d.pages || []).filter(visible).map(p => ({
            label: PAGE_LABEL === "title" ? p.title : String(p.path || "").replace(/^\//, ""),
            url: p.url || `${d.url}${p.path || ""}`,
            path: String(p.path || "").replace(/^\//, ""),
          }));
          pages.unshift({ label: "", url: d.url });   // blank first subpage = the subdomain's root, always the default
          return { sub: d.subdomain, url: d.url, pages };
        });
      if (!SITES.length) throw new Error("no domains");
      subLabels = SITES.map(s => s.sub);
      dom.n = SITES.length;
      const end = Math.max(0, SITES.findIndex(s => s.sub === START_SUBDOMAIN));
      dom.pos = end;
      hintEl.textContent = "scroll / swipe / ↑ ↓ to move · → select · ← back · enter / click / tap to select";
      ready = true;
      recentre(true);   // centre the landing subdomain immediately, before anything is drawn
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {   // opening spin: one full loop plus a bit
        const start = end - (dom.n + 8);
        dom.pos = start; intro = { reel: dom, start, end, t0: null, ms: INTRO_MS };
      }
      requestAnimationFrame(tick);
    })
    .catch(err => { hintEl.textContent = "couldn't load sitemap.json"; console.error(err); });

  // ── Drawing ────────────────────────────────────────────────────────────────
  // Chosen row stays; the rest fade by r.dim (0 = all visible, 1 = only the chosen row)
  function draw(r, rows, list, white, chromaLabel, colors) {
    const base = Math.round(r.pos), frac = r.pos - base;
    rows.forEach((el, j) => {
      const k = j - MID, d = k - frac, label = list[mod(base + k, list.length)];
      if (el._t !== label) { el.textContent = label; el._t = label; }
      let o = Math.max(0, 1 - Math.abs(d) * 0.26);
      if (k !== 0) o *= 1 - r.dim * r.dim * (3 - 2 * r.dim);   // smoothstep ease
      el.style.transform = `translateY(${d * rowPx}px)`;
      el.style.opacity = o.toFixed(3);
      const chroma = k === 0 && white && label === chromaLabel;
      el.classList.toggle("chroma", chroma);
      const custom = k === 0 && white && colors && colors[mod(base + k, list.length)];
      el.style.color = chroma ? "" : custom || (k === 0 && white ? "#fff" : "");
    });
  }

  // Shift the whole line so the full URL as currently selected is centred on the page.
  // Domain stage: "sub.briancrink.com" · Page stage: "sub.briancrink.com/page"
  const ctx = document.createElement("canvas").getContext("2d");
  let centredKey = null;
  const centreKey = () => `${mode}:${mod(Math.round(dom.pos), dom.n)}`;   // page stage: fixed per subdomain
  function recentre(instant = false) {
    const cs = getComputedStyle(document.body);
    ctx.font = `${cs.fontSize} ${cs.fontFamily}`;
    const ws = ctx.measureText(curSite().sub).width;
    let shift = ws / 2;
    if (mode === "page") {
      // Make room for the widest subpage up front, so none overflow while scrolling through them
      const wr = Math.max(...pagesList.map(p => ctx.measureText("/" + p).width));
      shift = (ws - wr) / 2;
    }
    if (instant) lineEl.style.transition = "none";       // initial placement: no slide
    lineEl.style.transform = `translateX(${shift}px)`;
    if (instant) { void lineEl.offsetWidth; lineEl.style.transition = ""; }
  }

  // ── Stage changes ──────────────────────────────────────────────────────────
  function enterPages() {
    pageItems = curSite().pages; pagesList = pageItems.map(p => p.label);
    const cmap = PAGE_COLORS[curSite().sub] || {};
    pageColors = pageItems.map(p => cmap[p.path] || null);
    Object.assign(pg, { n: pageItems.length, pos: 0, vel: 0, target: null, dim: 0 });
    mode = "page"; pageTouched = false; rightEl.classList.add("on"); settledAt = null;
    recentre(); centredKey = centreKey();   // slide left now, as the subpages fade in
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {   // spin through the subpages, landing on the blank default
      const start = -(pg.n + 8);
      pg.pos = start; intro = { reel: pg, start, end: 0, t0: null, ms: PAGE_INTRO_MS };
    }
  }
  function backToDomains() {
    mode = "domain"; rightEl.classList.remove("on");
    holdIdx = mod(Math.round(dom.pos), dom.n); settledAt = null;
  }
  function startExit() {
    if (exiting) return;
    exiting = true; exitAt = performance.now() + FADE_OUT_MS + REDIRECT_PAUSE;
  }
  function go() { location.href = pageItems[mod(Math.round(pg.pos), pg.n)].url; }
  // Enter, a click or a tap all mean "select what is chosen"; ignored while a spin is still running
  function selectCurrent() {
    if (!ready || intro) return;
    if (mode === "domain") { touched(); enterPages(); }
    else { started = true; startExit(); }
  }
  const forward = () => { if (mode === "domain") enterPages(); };
  const back = () => { if (mode === "page") backToDomains(); };

  // ── Main loop ──────────────────────────────────────────────────────────────
  let prevT = 0;
  function tick(now) {
    const dt = prevT ? Math.min(now - prevT, 100) : 16; prevT = now;
    const r = active(); let settled = false;
    if (intro) {                          // spin: smooth ease-in-out toward the landing row
      if (intro.t0 === null) intro.t0 = now;
      const t = Math.min(1, (now - intro.t0) / intro.ms);
      const e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      intro.reel.pos = intro.start + (intro.end - intro.start) * e;
      if (t >= 1) { intro.reel.pos = intro.end; intro = null; }
    } else if (!exiting && !r.drag && now - lastInput > 120) {
      if (Math.abs(r.vel) > 0.02) { r.pos += r.vel; r.vel *= 0.95; r.target = null; }
      else {
        r.vel = 0;
        const goal = r.target !== null ? r.target : Math.round(r.pos), d = goal - r.pos;
        if (Math.abs(d) < 0.004) { r.pos = goal; r.target = null; settled = true; }
        else r.pos += d * 0.16;
      }
    }
    if (!exiting) isSettled = settled;   // keeps its last value while fading out to redirect
    if (!exiting && settled) {           // slide the whole URL to centre each time a selection settles
      const key = centreKey();
      if (key !== centredKey) { centredKey = key; recentre(); }
    }
    dom.dimTarget = mode === "page" ? 1 : 0;
    pg.dimTarget = exiting ? 1 : 0;
    [dom, pg].forEach(x => {
      const step = dt / (x.dimTarget ? FADE_OUT_MS : FADE_IN_MS);
      x.dim = x.dimTarget ? Math.min(1, x.dim + step) : Math.max(0, x.dim - step);
    });
    draw(dom, domRows, subLabels, mode === "page" || isSettled, CHROMA_SUBDOMAIN);
    draw(pg, pgRows, pagesList, mode === "page" && isSettled, null, pageColors);

    if (exiting) { if (now >= exitAt) { go(); return; } }
    else {
      if (mode === "domain" && holdIdx !== null && mod(Math.round(dom.pos), dom.n) !== holdIdx) holdIdx = null;
      // The default subdomain waits indefinitely for input; the default subpage waits 7s
      const auto = started && settled && !(mode === "domain" && holdIdx !== null);
      if (auto) {
        if (settledAt === null) settledAt = now;
        if (now - settledAt >= (mode === "page" && !pageTouched ? DEFAULT_PAGE_WAIT : DELAY)) {
          settledAt = null; mode === "domain" ? enterPages() : startExit();
        }
      } else settledAt = null;
    }
    requestAnimationFrame(tick);
  }

  // Back/forward: browsers can restore this page frozen from their back-forward cache.
  // Reload it so the opening spin and all input handling start fresh.
  addEventListener("pageshow", e => { if (e.persisted) location.reload(); });

  // ── Input ──────────────────────────────────────────────────────────────────
  // Trackpad / mouse wheel: free scroll (the OS supplies the momentum), then snaps to the nearest row
  let hx = 0, hxAt = 0;
  addEventListener("wheel", e => {
    e.preventDefault(); if (!ready) return; touched();
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) {            // sideways trackpad swipe
      hx += e.deltaX; const t = performance.now();
      if (Math.abs(hx) > 60 && t - hxAt > 600) { hx > 0 ? forward() : back(); hx = 0; hxAt = t; }
      return;
    }
    const r = active(); let dy = e.deltaY; if (e.deltaMode === 1) dy *= 33;
    r.pos += dy / (rowPx * 1.6); r.vel = 0; r.target = null; lastInput = performance.now();
  }, { passive: false });

  // Arrow keys: one step per press
  addEventListener("keydown", e => {
    if (!ready) return;
    const r = active();
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault(); touched();
      r.target = (r.target !== null ? r.target : Math.round(r.pos)) + (e.key === "ArrowDown" ? 1 : -1);
      r.vel = 0;
    } else if (e.key === "ArrowRight") { touched(); forward(); }
    else if (e.key === "ArrowLeft") { touched(); back(); }
    else if (e.key === "Enter") selectCurrent();
  });

  addEventListener("click", selectCurrent);

  // Touch: vertical drag follows the finger and keeps momentum; a sideways swipe moves between stages
  let sx = 0, sy = 0, lastY = 0, lastT = 0, axis = null, endX = 0, moved = false, tapT = 0;
  addEventListener("touchstart", e => {
    if (!ready) return;                 // a plain tap changes nothing until it ends (see touchend)
    const r = active(); r.drag = true; r.vel = 0; r.target = null; axis = null; moved = false; tapT = performance.now();
    sx = endX = e.touches[0].clientX; sy = lastY = e.touches[0].clientY; lastT = performance.now();
  }, { passive: true });
  addEventListener("touchmove", e => {
    e.preventDefault(); if (!ready) return;
    const r = active(), t = e.touches[0]; endX = t.clientX;
    if (!axis && Math.hypot(t.clientX - sx, t.clientY - sy) > 8)
      axis = Math.abs(t.clientX - sx) > Math.abs(t.clientY - sy) ? "x" : "y";
    if (axis && !moved) { moved = true; touched(); }   // real movement counts as input
    if (axis !== "y") return;
    const dy = (lastY - t.clientY) / rowPx;
    r.pos += dy; r.vel = Math.max(-1.5, Math.min(1.5, r.vel * 0.6 + dy * 0.4));
    lastY = t.clientY; lastT = performance.now(); lastInput = lastT;
  }, { passive: false });
  addEventListener("touchend", e => {
    if (!ready) return;
    if (axis === null && performance.now() - tapT < 500) {   // a tap: same as pressing Enter
      active().drag = false; e.preventDefault(); selectCurrent(); return;
    }
    const r = active(); r.drag = false;
    if (axis === "x") { r.vel = 0; const dx = sx - endX; if (dx > 50) forward(); else if (dx < -50) back(); }
    else if (performance.now() - lastT > 80) r.vel = 0;
    lastInput = 0;
  });
  </script>
</body>
</html>
